apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog-api }
  template:
    metadata:
      labels: { app: catalog-api }
    spec:
      containers:
        - name: catalog-api
          image: catalog-api:v1
          imagePullPolicy: IfNotPresent      # локальний образ
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-config
            - secretRef:
                name: catalog-secrets
          livenessProbe:                     # збій -> перезапуск контейнера
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
          readinessProbe:                    # збій -> под виключається з Service
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10